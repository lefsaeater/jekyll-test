<footer class="site-footer">
  <div class="site-footer__inner wrap">
    <div>
      <a class="wordmark wordmark--footer" href="{{ '/' | relative_url }}">
        <span class="wordmark__mark" aria-hidden="true">F/N</span>
        <span>{{ site.title }}</span>
      </a>
      <p>{{ site.description }}</p>
    </div>
    <div class="site-footer__links">
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://github.com/{{ site.repository }}">GitHub</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </div>
    <p class="site-footer__fineprint">&copy; {{ 'now' | date: '%Y' }} {{ site.author.name }}. Built with Jekyll.</p>
  </div>
</footer>
