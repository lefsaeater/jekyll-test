<header class="site-header">
  <div class="site-header__inner wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <span class="wordmark__mark" aria-hidden="true">F/N</span>
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Journal</a>
      <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>Archive</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
