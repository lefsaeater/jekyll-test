---
layout: default
---

<main id="main-content" class="page wrap wrap--narrow">
  <header class="page-header">
    <p class="eyebrow">{{ page.eyebrow | default: site.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</main>
